name: vita

on:
  push:
    branches: [ "vita-port" ]
  pull_request:
  workflow_dispatch:

jobs:
  vpk:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    steps:
      - name: Install build tools
        run: |
          if command -v apk >/dev/null 2>&1; then
            apk add --no-cache git bash cmake samurai ninja || apk add --no-cache git bash cmake ninja
          elif command -v apt-get >/dev/null 2>&1; then
            apt-get update && apt-get install -y --no-install-recommends git bash cmake ninja-build
          else
            echo "no known package manager in this image"; exit 1
          fi

      - uses: actions/checkout@v4

      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # the shader archive and livearea artwork come from the user's own game files,
      # so ci proves the tree builds and ships a fallback-shader vpk
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DKISAK_PLATFORM=vita \
                -DCMAKE_TOOLCHAIN_FILE=$VITASDK/share/vita.toolchain.cmake

      - name: Build
        run: cmake --build build

      - uses: actions/upload-artifact@v4
        with:
          name: COD4VITA-vpk
          path: build/scripts/vita/COD4VITA.vpk
          if-no-files-found: error
